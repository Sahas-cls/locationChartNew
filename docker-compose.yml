services:
  server:
    build: ./server
    container_name: locationchart-server
    env_file: ./server/.env
    environment:
      API_PORT: 3000
    expose:
      - "3000"
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    container_name: locationchart-client
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - server
    restart: unless-stopped
